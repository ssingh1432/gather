name: Pages rich visitor integration
on:
  push:
    branches:
      - pages/rich-visitor-posts-final
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Pages-only wiring
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python3 /tmp/repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/pages-rich-visitor-integrate.yml flutter_app/lib/features/pages/.rich-visitor-final-trigger
          git add flutter_app/lib/features/pages/page_profile_screen.dart .github/workflows/pages-rich-visitor-integrate.yml flutter_app/lib/features/pages/.rich-visitor-final-trigger
          git commit -m 'feat(Pages): wire rich visitor posts into Page profile'
          git push origin HEAD:pages/rich-visitor-posts-final