name: Pages Home card patch

on:
  push:
    paths:
      - '.github/page-home-card-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Home for Page visitor posts
        shell: python
        run: |
          from pathlib import Path

          path = Path('flutter_app/lib/features/home/home_feed_screen.dart')
          text = path.read_text()

          import_anchor = "import '../../shared/widgets/notification_bell.dart';"
          page_import = "import '../pages/page_visitor_post_home_card.dart';"
          if page_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Home import anchor not found')
              text = text.replace(import_anchor, import_anchor + "\n" + page_import, 1)

          marker = """                          final p = rowPost as PostModel;\n                          return Column("""
          replacement = """                          final p = rowPost as PostModel;\n                          if (p.contentType == 'page_visitor') {\n                            final location = p.location ?? '';\n                            final prefix = 'Posted on ';\n                            final pageName = location.startsWith(prefix)\n                                ? location.substring(prefix.length)\n                                : 'Page';\n                            return PageVisitorPostHomeCard(\n                              key: ValueKey('page-visitor-${p.id}'),\n                              post: p,\n                              pageId: p.communityId,\n                              pageName: pageName,\n                            );\n                          }\n                          return Column("""
          if marker not in text:
              raise SystemExit('Home PostCard render anchor not found')
          if "PageVisitorPostHomeCard(" not in text:
              text = text.replace(marker, replacement, 1)

          path.write_text(text)

          cache = Path('flutter_app/lib/shared/services/feed_offline_cache.dart')
          cache_text = cache.read_text()
          old = """        'content_type': p.contentType,\n        'is_pinned': p.isPinned,"""
          new = """        'content_type': p.contentType,\n        'is_pinned': p.isPinned,\n        'page_id': p.contentType == 'page_visitor' ? p.communityId : null,"""
          if old in cache_text and "'page_id':" not in cache_text:
              cache.write_text(cache_text.replace(old, new, 1))

          # The trigger file is only a one-shot mechanism for this scoped patch.
          Path('.github/page-home-card-trigger').unlink(missing_ok=True)
      - name: Commit Pages Home card patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/features/home/home_feed_screen.dart flutter_app/lib/shared/services/feed_offline_cache.dart .github/page-home-card-trigger
          git diff --cached --quiet && exit 0
          git commit -m "Pages: render visitor posts distinctly in Home"
          git push
