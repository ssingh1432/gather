name: Flutter CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - work

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

  build-android-apk:
    name: Build Android APK
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_app/android/**/gradle-wrapper.properties', 'flutter_app/android/**/build.gradle*', 'flutter_app/android/**/settings.gradle*', 'flutter_app/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android CMake
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-cmake-3.22.1-${{ runner.os }}

      - name: Configure Gradle for CI
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.vfs.watch=false
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.workers.max=4
          EOF

      - name: Set up release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          # Strip any stray whitespace/newlines the secret might carry (a
          # common cause of "corrupted keystore" errors after copy-paste)
          # before decoding.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/gather_release.jks
          cat > android/key.properties <<KEYPROPS
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=gather_release
          storeFile=../gather_release.jks
          KEYPROPS
          echo "Decoded keystore SHA-256: $(sha256sum android/gather_release.jks | cut -d' ' -f1)"
          echo "Decoded keystore size (bytes): $(stat -c%s android/gather_release.jks)"
        # If these secrets aren't set, build.gradle.kts falls back to debug
        # signing automatically — this step just no-ops in that case.
        # The SHA-256/size lines above are safe to log (they're not the
        # secret itself) and let us confirm the decoded file is intact
        # without exposing any key material.

      - name: Build release APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
        # ARM64 is the production Android architecture used by modern phones.
        # Building one ABI avoids compiling and packaging unnecessary native
        # architectures in CI, significantly reducing release-build time.

      # Do not upload an APK on every push. GitHub Actions artifact storage was
      # exhausted by repeated APK uploads, causing otherwise-successful builds
      # to be marked failed. Manual workflow runs still produce a downloadable
      # APK artifact for testing/release preparation.
      - name: Upload APK artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gather-android-apk-arm64
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Build web and deploy to VPS
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Cache-bust the web entry point
        run: |
          sed -i "s#src=\"flutter_bootstrap.js\"#src=\"flutter_bootstrap.js?v=${GITHUB_SHA}\"#" build/web/index.html
          grep -o 'src="flutter_bootstrap.js[^\"]*"' build/web/index.html

      - name: Deploy build/web to VPS
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: flutter_app/build/web/
          TARGET: /
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ".well-known/, .git/"
