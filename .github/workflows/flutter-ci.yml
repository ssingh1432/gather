name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: |
          set +e
          flutter analyze > /tmp/analyze_output.txt 2>&1
          code=$?
          cat /tmp/analyze_output.txt
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              esc=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::$esc"
            done < /tmp/analyze_output.txt
          fi
          exit $code

      - name: Run Flutter tests
        run: flutter test

  build-android-apk:
    name: Build Android APK
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        # Signed with the debug keystore for now (see build.gradle.kts TODO) —
        # fine for sideloading/testing, not for Play Store submission.
        # receive_sharing_intent declares a compileSdk 37 requirement, but
        # platform 37 isn't an actual installable SDK yet (sdkmanager: "Failed
        # to find package"). compileSdk is backwards-compatible in practice
        # for a plugin like this (no SDK-37-specific APIs at play), so we
        # skip Flutter's validation rather than chase a platform that
        # doesn't exist.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gather-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  deploy:
    name: Build web and deploy to VPS
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Deploy build/web to VPS
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: flutter_app/build/web/
          TARGET: /
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: ".well-known/, .git/"
