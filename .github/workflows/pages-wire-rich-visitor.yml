name: Pages wire rich visitor posts
on:
  push:
    branches: [pages/rich-visitor-posts-v2]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire existing Page-local rich visitor components
        env:
          PATCH_SCRIPT: 
        run: |
          python3 - <<'PY'
          import base64, os
          exec(compile(base64.b64decode(os.environ['PATCH_SCRIPT']), '<pages-patch>', 'exec'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/features/pages/page_profile_screen.dart
          git commit -m 'fix(Pages): wire rich visitor posts into Page profile' || true
          git push origin HEAD:pages/rich-visitor-posts-v2
