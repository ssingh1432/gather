# Include inside the HTTPS `server { }` block for eiquoab.xyz:  include /etc/nginx/snippets/gather-security-headers.conf;
# Test with: nginx -t && systemctl reload nginx ; then check https://securityheaders.com
# CSP is permissive enough for Flutter Web (CanvasKit needs 'wasm-unsafe-eval'; fonts/images may come from Supabase).
# Tighten connect-src/img-src to your exact Supabase project host once verified in the browser console (report-only first).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
# Start with Report-Only; switch the header name to Content-Security-Policy after a clean week.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://*.googleusercontent.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.gstatic.com https://fonts.gstatic.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://rc-epay.esewa.com.np https://epay.esewa.com.np" always;
